# Alembic configuration. The database URL is deliberately absent: env.py reads
# it from sawti.config (DATABASE_URL), the same place the app reads it, unless
# a caller sets `sqlalchemy.url` programmatically (the migration tests do).
#
#   uv run alembic upgrade head
#   uv run alembic revision --autogenerate -m "describe the change"

[alembic]
# A package resource rather than a filesystem path, so an installed `sawti`
# (the 6.2 `migrate` container) finds its migrations without the source tree.
script_location = sawti.db:migrations
file_template = %%(rev)s_%%(slug)s
prepend_sys_path = .
path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
