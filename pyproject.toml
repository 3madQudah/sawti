[project]
name = "sawti"
version = "0.1.0"
description = "Self-improving agent for bilingual (Arabic/English/code-switched) contact center call analysis."
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "Proprietary" }
authors = [{ name = "Sawti" }]

dependencies = [
    "pydantic>=2.7,<3.0",
    "pydantic-settings>=2.3,<3.0",
    "langgraph>=0.2,<0.3",
    "langchain-core>=0.2,<0.3",
    "fastapi>=0.111,<0.112",
    "uvicorn[standard]>=0.30,<0.31",
    "celery[redis]>=5.4,<6.0",
    "redis>=5.0,<6.0",
    "sqlalchemy>=2.0,<3.0",
    "psycopg[binary]>=3.1,<4.0",
    "alembic>=1.13,<2.0",
    "anthropic>=0.30,<1.0",
    "openai>=1.35,<2.0",
    "langfuse>=2.36,<3.0",
    "numpy>=1.26,<2.0",
]

[project.optional-dependencies]
asr = [
    "openai-whisper>=20231117",
    "pyannote.audio>=3.1,<4.0",
]
vllm = [
    "vllm>=0.5,<0.6",
]
dev = [
    "pytest>=8.2,<9.0",
    "pytest-asyncio>=0.23,<0.24",
    "pytest-cov>=5.0,<6.0",
    "ruff>=0.5,<0.6",
    "mypy>=1.10,<2.0",
]

[project.scripts]
sawti = "sawti.api.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sawti"]

[tool.ruff]
line-length = 110
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "N", "ANN", "RUF"]
ignore = ["ANN401"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["ANN"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "src"
exclude = ["notebooks", "scripts"]

[[tool.mypy.overrides]]
module = ["whisper.*", "pyannote.*", "vllm.*", "langfuse.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
asyncio_mode = "auto"

[tool.coverage.run]
source = ["src/sawti"]
