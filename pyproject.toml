[project]
name = "sawti"
version = "0.1.0"
description = "Self-improving agent for bilingual (Arabic/English/code-switched) contact center call analysis."
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { text = "Proprietary" }
authors = [{ name = "Sawti" }]

dependencies = [
    "pydantic>=2.7,<3.0",
    "pydantic-settings>=2.3,<3.0",
    "langgraph>=0.2,<0.3",
    "langchain-core>=0.2,<0.3",
    "fastapi>=0.111,<0.112",
    "uvicorn[standard]>=0.30,<0.31",
    "celery[redis]>=5.4,<6.0",
    "redis>=5.0,<6.0",
    "sqlalchemy>=2.0,<3.0",
    "psycopg[binary]>=3.1,<4.0",
    "alembic>=1.13,<2.0",
    "anthropic>=0.30,<1.0",
    "openai>=1.35,<2.0",
    "google-genai>=1.0,<2.0",
    "langfuse>=2.36,<3.0",
    "numpy>=1.26,<3",
    # Phase 4 rule memory (sawti.memory.store): local, multilingual sentence
    # embeddings for top-k rule retrieval — no embedding provider is
    # configured anywhere in sawti.config, and this needs no new infra
    # (no pgvector, no external embedding API). See docs/09-DECISIONS.md.
    "sentence-transformers>=3.0,<4.0",
]

[project.optional-dependencies]
asr = [
    "openai-whisper>=20231117",
    "pyannote.audio>=3.1,<4.0",
    # Apple-Silicon Whisper backend. Runs large-v3-turbo on the M1 GPU via MLX,
    # ~8x faster than CPU large-v3 on this hardware (see docs/09-DECISIONS.md).
    # Optional at runtime: sawti.asr.transcribe falls back to openai-whisper
    # where MLX is unavailable.
    "mlx-whisper>=0.4; sys_platform == 'darwin' and platform_machine == 'arm64'",
]
tts = [
    # Synthesizes the Phase 3 evaluation audio from the Phase 1 transcripts.
    # Chosen for its ar-JO (Jordanian) voice pair; see docs/09-DECISIONS.md.
    "edge-tts>=6.1,<8.0",
]
vllm = [
    "vllm>=0.5,<0.6",
]
finetune = [
    # Phase 5 QLoRA training (scripts/train_qlora.py). CUDA-only: bitsandbytes'
    # 4-bit quantization kernels need a real GPU, so this group is meant for a
    # Colab/CUDA host, never this project's Mac dev environment (no CUDA —
    # see docs/09-DECISIONS.md) — same platform split as the `vllm` group
    # above and the `mlx-whisper` marker in `asr`. `torch` is already
    # present as a `sentence-transformers` transitive dep and is not
    # repeated here.
    #
    # Every version below, including `transformers`, is an exact pin
    # (`==`), not a range: the prior `>=,<` ranges resolved a peft/trl pair
    # from mid-2024 against whatever `transformers` the rest of the
    # dependency graph floated to (unpinned, via `sentence-transformers`),
    # which "succeeded" dependency-resolution-wise but broke at import
    # time on Colab (peft's LoRA tuner code importing a symbol that code
    # path assumed was there). Pinning `transformers` here too closes that
    # gap for good — this extra no longer depends on what the base graph
    # happens to float to. This set is verified (2026-09-25) to actually
    # interoperate: real installs of peft+trl+accelerate+datasets against
    # transformers 4.57.6 import cleanly (also checked against 5.17.0, in
    # case a future base-dependency change floats transformers higher
    # again), and `scripts/train_qlora.py`'s real SFTConfig/SFTTrainer/LoRA
    # wiring runs a full CPU training loop against a tiny real
    # Qwen2-architecture model without error. Not verified: bitsandbytes'
    # actual 4-bit quantization path (no CUDA here) or the real 8B
    # checkpoint. See docs/09-DECISIONS.md.
    "transformers==4.57.6",
    "peft==0.21.0",
    "bitsandbytes==0.50.2",
    "accelerate==1.15.0",
    "trl==1.14.0",
    "datasets==5.0.1",
]
dev = [
    "pytest>=8.2,<9.0",
    "pytest-asyncio>=0.23,<0.24",
    "pytest-cov>=5.0,<6.0",
    "ruff>=0.5,<0.6",
    "mypy>=1.10,<2.0",
]

[project.scripts]
sawti = "sawti.api.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sawti"]

[tool.ruff]
line-length = 110
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "N", "ANN", "RUF"]
# ANN101/ANN102 (annotate `self`/`cls`) are deprecated upstream in ruff and
# were never satisfied in this repo — annotating `self` carries no information.
# RUF001/2/3 (ambiguous unicode) fire on essentially every Arabic literal —
# alef reads as `l`, heh as `o`, the Arabic-Indic digits as Latin letters. This
# is a bilingual Arabic/English codebase whose test fixtures, WER normalization
# table and transcript repairs are all necessarily Arabic text, so the rule is
# pure noise here rather than a real homoglyph risk.
ignore = ["ANN401", "ANN101", "ANN102", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["ANN"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "src"
exclude = ["notebooks", "scripts"]

[[tool.mypy.overrides]]
module = ["whisper.*", "pyannote.*", "vllm.*", "langfuse.*", "mlx_whisper.*", "edge_tts.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
asyncio_mode = "auto"

[tool.coverage.run]
source = ["src/sawti"]
