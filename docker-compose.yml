# Local stack. `make up` starts postgres + redis only (dev/test against them
# from the host); `make stack` builds and starts the whole service (phase 6.2).

x-sawti-env: &sawti-env
  # Inside the network the services talk to each other by name. These
  # override the host-oriented DATABASE_URL / REDIS urls in .env.
  # SAWTI_SERVICE_DB picks the database the stack uses (default: the dev
  # database). scripts/measure_service.py points it at a scratch one.
  DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-sawti}:${POSTGRES_PASSWORD:-sawti}@postgres:5432/${SAWTI_SERVICE_DB:-sawti}
  REDIS_URL: redis://redis:6379/0
  CELERY_BROKER_URL: redis://redis:6379/0
  CELERY_RESULT_BACKEND: redis://redis:6379/1
  # Empty = unset: the API then refuses every protected route (fail closed).
  SAWTI_API_KEY: ${SAWTI_API_KEY:-}
  SAWTI_CORS_ORIGINS: ${SAWTI_CORS_ORIGINS:-[]}
  # `fake` = deterministic offline provider, used by the e2e and the load
  # measurement; `gemini` needs GEMINI_API_KEY in .env.
  SAWTI_LLM_PROVIDER: ${SAWTI_LLM_PROVIDER:-gemini}
  SAWTI_FAKE_LLM_LATENCY_SECONDS: ${SAWTI_FAKE_LLM_LATENCY_SECONDS:-0}
  SAWTI_WORKER_PRELOAD_EMBEDDINGS: ${SAWTI_WORKER_PRELOAD_EMBEDDINGS:-true}
  SAWTI_CONFIDENCE_THRESHOLD: ${SAWTI_CONFIDENCE_THRESHOLD:-0.7}
  SAWTI_LOG_LEVEL: ${SAWTI_LOG_LEVEL:-INFO}
  # Self-hosted tracing (phase 6.3). Keys come from .env; empty = tracing off.
  LANGFUSE_HOST: http://langfuse:3000
  LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-}
  LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-}

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sawti}
      POSTGRES_USER: ${POSTGRES_USER:-sawti}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sawti}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - sawti_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sawti}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # One-shot: create the `langfuse` database if missing, schema to head, then
  # LangGraph's checkpoint tables — once,
  # before any worker, because the checkpointer's first-time setup() is not
  # safe to run from several processes at once.
  migrate:
    build: { context: ., target: api }
    image: sawti-api
    profiles: ["service"]
    env_file: [{ path: .env, required: false }]
    environment: *sawti-env
    command:
      - sh
      - -c
      - python -m sawti.db.bootstrap langfuse && alembic upgrade head && python -m sawti.db.checkpointer
    depends_on:
      postgres: { condition: service_healthy }
    restart: "no"

  api:
    build: { context: ., target: api }
    image: sawti-api
    profiles: ["service"]
    env_file: [{ path: .env, required: false }]
    environment: *sawti-env
    ports:
      - "${SAWTI_API_PORT:-8000}:8000"
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  # Scale with `docker compose --profile service up -d --scale worker=N`.
  # One task at a time per container (--concurrency=1), so N containers = N
  # tasks in flight.
  worker:
    build: { context: ., target: worker }
    image: sawti-worker
    profiles: ["service"]
    env_file: [{ path: .env, required: false }]
    environment: *sawti-env
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    restart: unless-stopped

  # Langfuse v2, self-hosted (phase 6.3). v2, not v3: it needs only Postgres
  # (its own `langfuse` database on the shared server), where v3 adds
  # ClickHouse, MinIO and Redis — too much for the 3.8 GiB Docker VM next to
  # the workers. Never Langfuse Cloud: traces carry (redacted) transcripts.
  # UI at http://localhost:3000, login LANGFUSE_INIT_USER_EMAIL / _PASSWORD.
  langfuse:
    image: langfuse/langfuse:2
    profiles: ["service"]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-sawti}:${POSTGRES_PASSWORD:-sawti}@postgres:5432/langfuse
      NEXTAUTH_URL: http://localhost:3000
      NEXTAUTH_SECRET: ${LANGFUSE_NEXTAUTH_SECRET:-}
      SALT: ${LANGFUSE_SALT:-}
      ENCRYPTION_KEY: ${LANGFUSE_ENCRYPTION_KEY:-}
      TELEMETRY_ENABLED: "false"
      AUTH_DISABLE_SIGNUP: "true"
      # Next.js binds to the container hostname by default; listen on all
      # interfaces so the in-container healthcheck can reach 127.0.0.1.
      HOSTNAME: 0.0.0.0
      LANGFUSE_INIT_ORG_ID: sawti
      LANGFUSE_INIT_ORG_NAME: Sawti
      LANGFUSE_INIT_PROJECT_ID: sawti
      LANGFUSE_INIT_PROJECT_NAME: sawti
      LANGFUSE_INIT_PROJECT_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-}
      LANGFUSE_INIT_PROJECT_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-}
      LANGFUSE_INIT_USER_EMAIL: ${LANGFUSE_INIT_USER_EMAIL:-admin@sawti.local}
      LANGFUSE_INIT_USER_NAME: admin
      LANGFUSE_INIT_USER_PASSWORD: ${LANGFUSE_INIT_USER_PASSWORD:-}
    ports:
      - "3000:3000"
    depends_on:
      migrate: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/public/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 18
    restart: unless-stopped

  # Celery beat: runs the reaper (`sawti.reap_stuck_calls`) on a schedule.
  # Exactly one instance — never scale this service.
  beat:
    build: { context: ., target: api }
    image: sawti-api
    profiles: ["service"]
    env_file: [{ path: .env, required: false }]
    environment: *sawti-env
    command: ["celery", "-A", "sawti.api.tasks", "beat", "--loglevel=INFO", "--schedule=/tmp/celerybeat-schedule"]
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    restart: unless-stopped

volumes:
  sawti_postgres_data:
