services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sawti}
      POSTGRES_USER: ${POSTGRES_USER:-sawti}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sawti}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - sawti_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sawti}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  sawti_postgres_data:
